# devops-env-config :: minimal tmux configuration.
#
# This file is a FALLBACK, not the daily driver. modules/50-editors.sh installs
# it as ~/.tmux.conf only when there is no ~/.tmux.conf at all AND the
# Ujstor/tmux-config clone did not succeed — a fresh server, or a box with no
# outbound access to github.com. If you already have a ~/.tmux.conf, nothing
# here is ever written.
#
# It is deliberately small: no plugin manager, no theme, no network fetch at
# first start. Everything below works on the tmux in bookworm (3.3a) and in
# noble (3.4) without a version check.

# C-a is easier to reach than C-b and does not collide with readline's C-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
# The OUTER terminal's true-colour capability, declared for the inner one.
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000

# vi keys in copy mode; `y` copies through the portable `clip` executable that
# modules/38-auth-sso.sh installs, so the same binding works on WSL, on Wayland,
# on X11 and over SSH (OSC 52).
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip'
bind P run-shell 'clip-paste | tmux load-buffer - && tmux paste-buffer'

# Splits that keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# DO NOT set DISPLAY here. `set-environment -g DISPLAY :1` makes a headless box
# look graphical to every tool that tries to open a browser, which is the single
# most likely thing to silently break browser-based logins inside tmux.
set -ga update-environment DISPLAY

set -g status-interval 5
set -g status-left-length 30
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M "
