# devops-env-config :: portable clipboard + no fake DISPLAY.
# Add this ONE line to ~/.tmux.conf (this repo never edits that file):
#   source-file ~/.config/devops-env/tmux/devenv-clipboard.conf
#
# Ujstor/tmux-config already sets `allow-passthrough on` and `set-clipboard on`.
# set-clipboard only acts when the OUTER terminal has an `Ms` terminfo entry,
# which most do not advertise — declare it:
set -ga terminal-features ',*:clipboard'

# Portable copy/paste. Replaces the hardcoded `clip.exe` / `powershell.exe`
# literals: neither name resolves on this box today (the Windows PATH is not on
# this shell's PATH), and neither can work on a Debian VM at all. `clip` and
# `clip-paste` pick a backend at runtime — wslclip, wayland, x11 or OSC 52.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip'
bind P run-shell 'clip-paste | tmux load-buffer - && tmux paste-buffer'

# DO NOT set DISPLAY here, and delete `set-environment -g DISPLAY :1` from
# ~/.tmux.conf: inside tmux it makes a headless box look graphical to every
# browser-opening tool. open-url's own probe requires a real X11/Wayland socket
# and is not fooled, but other tools have no such guard.
set -ga update-environment DISPLAY
