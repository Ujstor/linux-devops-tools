# linux-devops-tools :: k9s plugins :: secrets & configmaps
#
# NOTE: k9s already binds <x> Decode and <u> UsedBy on secrets.
#
# MUST-FIX S8 - decoded secrets NEVER leave this terminal:
#   * no plugin pipes a decoded value into a clipboard backend (it would land in
#     the Windows clipboard, survive the k9s session and be pasted by accident),
#   * no plugin writes secret material into /tmp,
#   * every plugin that decodes is `dangerous: true`, so k9s drops it entirely on
#     a readOnly context - the prod skins set readOnly, so on prod these keys do
#     not exist at all.
# Use Shift-C, read the value off the pager, and let it scroll away.
plugins:
  secret-decode-all:
    shortCut: Shift-D
    description: Decode all keys (pager)
    scopes: [secrets]
    dangerous: true
    confirm: false
    background: false
    command: bash
    args:
      - -c
      - |
        set -o pipefail
        ns="$1"; name="$2"; ctx="$3"
        kubectl get secret "$name" --context "$ctx" -n "$ns" -o json \
          | jq -r '.data // {} | to_entries[] | "=== \(.key) ===\n\(.value|@base64d)\n"' \
          | less -R
      - --
      - $NAMESPACE
      - $NAME
      - $CONTEXT

  secret-edit-decoded:
    shortCut: Shift-M
    description: Edit decoded (modify-secret)
    scopes: [secrets]
    dangerous: true
    confirm: true
    background: false
    command: bash
    args:
      - -c
      - |
        # kubectl-modify-secret decodes into an $EDITOR scratch file of its own.
        # Point TMPDIR at a private 0700 dir first so that file cannot land in
        # world-readable /tmp (MUST-FIX S8).
        ns="$1"; name="$2"; ctx="$3"
        td="${XDG_RUNTIME_DIR:-$HOME/.cache}/devenv-k9s"
        mkdir -p "$td" && chmod 700 "$td" || exit 1
        TMPDIR="$td" exec kubectl modify-secret --context "$ctx" -n "$ns" "$name"
      - --
      - $NAMESPACE
      - $NAME
      - $CONTEXT

  secret-show-value:
    shortCut: Shift-C
    description: Show one key (pager)
    scopes: [secrets]
    dangerous: true
    confirm: false
    background: false
    command: bash
    args:
      - -c
      - |
        set -o pipefail
        ns="$1"; name="$2"; ctx="$3"
        json="$(kubectl get secret "$name" --context "$ctx" -n "$ns" -o json)" || exit 1
        keys="$(printf '%s' "$json" | jq -r '.data // {} | keys[]')"
        if [ -z "$keys" ]; then
          echo "secret/$name has no data keys"; read -r -p "press enter" _; exit 0
        fi
        if command -v fzf >/dev/null 2>&1; then
          key="$(printf '%s\n' "$keys" | fzf --prompt="key> " --height=40%)"
        else
          printf '%s\n' "$keys"
          read -r -p "key> " key
        fi
        [ -z "$key" ] && exit 0
        {
          echo "=== $key ==="
          printf '%s' "$json" | jq -r --arg k "$key" '.data[$k] // "" | @base64d'
          echo
        } | less -R
      - --
      - $NAMESPACE
      - $NAME
      - $CONTEXT
