# linux-devops-tools :: k9s skin :: caution-uat
# UAT / staging - amber chrome.
k9s:
  body:
    fgColor: '#e6e6e6'
    bgColor: default
    logoColor: '#ffb302'
    logoColorMsg: '#a6adc8'
    logoColorInfo: '#a6e3a1'
    logoColorWarn: '#f9e2af'
    logoColorError: '#f38ba8'
  prompt:
    fgColor: '#ffb302'
    bgColor: default
    suggestColor: '#ffb302'
  info:
    fgColor: '#ffb302'
    sectionColor: '#a87a00'
    cpuColor: '#89dceb'
    memColor: '#cba6f7'
    k9sRevColor: '#6c7086'
  help:
    fgColor: '#cdd6f4'
    bgColor: '#2a2100'
    keyColor: '#ffb302'
    numKeyColor: '#cba6f7'
    sectionColor: '#a6e3a1'
  dialog:
    fgColor: '#cdd6f4'
    bgColor: '#2a2100'
    buttonFgColor: '#1a1400'
    buttonBgColor: '#ffb302'
    buttonFocusFgColor: '#1a1400'
    buttonFocusBgColor: '#ffffff'
    labelFgColor: '#ffb302'
    fieldFgColor: '#cdd6f4'
  frame:
    border:
      fgColor: '#a87a00'
      focusColor: '#ffb302'
    menu:
      fgColor: '#cdd6f4'
      keyColor: '#ffb302'
      numKeyColor: '#cba6f7'
      fgStyle: normal
    crumbs:
      fgColor: '#1a1400'
      bgColor: '#ffb302'
      activeColor: '#ffffff'
    status:
      newColor: '#89dceb'
      modifyColor: '#cba6f7'
      addColor: '#a6e3a1'
      pendingColor: '#fab387'
      errorColor: '#f38ba8'
      highlightColor: '#89b4fa'
      killColor: '#f5c2e7'
      completedColor: '#6c7086'
    title:
      fgColor: '#ffb302'
      bgColor: default
      highlightColor: '#ffffff'
      counterColor: '#a6e3a1'
      filterColor: '#f5c2e7'
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors:
      - '#a6e3a1'
      - '#f38ba8'
      defaultChartColors:
      - '#a6e3a1'
      - '#f38ba8'
    table:
      fgColor: '#cdd6f4'
      bgColor: default
      cursorFgColor: '#1a1400'
      cursorBgColor: '#ffb302'
      markColor: '#f9e2af'
