        fgColor: '#a87a00'
        bgColor: default
        sorterColor: '#f9e2af'
        selectedSortColumnColor: '#a6e3a1'
    xray:
      fgColor: '#cdd6f4'
      bgColor: default
      cursorColor: '#ffb302'
      cursorTextColor: '#11111b'
      graphicColor: '#f9e2af'
    yaml:
      keyColor: '#ffb302'
      colonColor: '#6c7086'
      valueColor: '#cdd6f4'
    picker:
      mainColor: '#cdd6f4'
      focusColor: '#ffb302'
      shortcutColor: '#f9e2af'
    logs:
      fgColor: '#cdd6f4'
      bgColor: default
      indicator:
        fgColor: '#ffb302'
        bgColor: default
        toggleOnColor: '#a6e3a1'
        toggleOffColor: '#6c7086'
