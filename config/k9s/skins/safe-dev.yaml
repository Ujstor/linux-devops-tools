      cursorColor: '#4ade80'
      cursorTextColor: '#11111b'
      graphicColor: '#f9e2af'
    yaml:
      keyColor: '#4ade80'
      colonColor: '#6c7086'
      valueColor: '#cdd6f4'
    picker:
      mainColor: '#cdd6f4'
      focusColor: '#4ade80'
      shortcutColor: '#f9e2af'
    logs:
      fgColor: '#cdd6f4'
      bgColor: default
      indicator:
        fgColor: '#4ade80'
        bgColor: default
        toggleOnColor: '#a6e3a1'
        toggleOffColor: '#6c7086'
