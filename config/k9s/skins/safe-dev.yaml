      modifyColor: '#cba6f7'
      addColor: '#a6e3a1'
      pendingColor: '#fab387'
      errorColor: '#f38ba8'
      highlightColor: '#89b4fa'
      killColor: '#f5c2e7'
      completedColor: '#6c7086'
    title:
      fgColor: '#4ade80'
      bgColor: default
      highlightColor: '#ffffff'
      counterColor: '#a6e3a1'
      filterColor: '#f5c2e7'
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors:
      - '#a6e3a1'
      - '#f38ba8'
