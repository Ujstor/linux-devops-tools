# devops-env-config :: k9s skin :: safe-dev
# dev / lab - green chrome, safe to break.
k9s:
  body:
    fgColor: '#e6e6e6'
    bgColor: default
    logoColor: '#4ade80'
    logoColorMsg: '#a6adc8'
    logoColorInfo: '#a6e3a1'
    logoColorWarn: '#f9e2af'
    logoColorError: '#f38ba8'
  prompt:
    fgColor: '#4ade80'
    bgColor: default
    suggestColor: '#4ade80'
  info:
    fgColor: '#4ade80'
    sectionColor: '#2f8f57'
    cpuColor: '#89dceb'
    memColor: '#cba6f7'
    k9sRevColor: '#6c7086'
  help:
    fgColor: '#cdd6f4'
    bgColor: '#0d2a17'
    keyColor: '#4ade80'
    numKeyColor: '#cba6f7'
    sectionColor: '#a6e3a1'
  dialog:
    fgColor: '#cdd6f4'
    bgColor: '#0d2a17'
    buttonFgColor: '#001a0b'
