# devops-env-config :: k9s skin :: devenv-dark  (daily driver)
# Palette: Catppuccin Mocha. Hex is supported by k9s (Color.isHex: "#rrggbb").
# Use "default" or "-" for any colour you want to inherit from the terminal.
k9s:
  body:
    fgColor: "#cdd6f4"       # text
    bgColor: default         # keep the terminal / tmux background
    logoColor: "#89b4fa"     # blue
    logoColorMsg: "#a6adc8"
    logoColorInfo: "#a6e3a1"
    logoColorWarn: "#f9e2af"
    logoColorError: "#f38ba8"
  prompt:
    fgColor: "#cdd6f4"
    bgColor: default
    suggestColor: "#89b4fa"
  info:
    fgColor: "#f9e2af"       # values
    sectionColor: "#a6adc8"  # labels
    cpuColor: "#89dceb"
    memColor: "#cba6f7"
    k9sRevColor: "#6c7086"
  help:
    fgColor: "#cdd6f4"
    bgColor: "#181825"
    keyColor: "#89b4fa"
    numKeyColor: "#cba6f7"
    sectionColor: "#a6e3a1"
  dialog:
    fgColor: "#cdd6f4"
    bgColor: "#181825"
    buttonFgColor: "#11111b"
    buttonBgColor: "#89b4fa"
    buttonFocusFgColor: "#11111b"
    buttonFocusBgColor: "#f9e2af"
    labelFgColor: "#f5c2e7"
    fieldFgColor: "#cdd6f4"
  frame:
    border:
      fgColor: "#45475a"
      focusColor: "#89b4fa"
    menu:
      fgColor: "#cdd6f4"
      keyColor: "#89b4fa"
      numKeyColor: "#cba6f7"
      fgStyle: normal
    crumbs:
      fgColor: "#11111b"
      bgColor: "#585b70"
      activeColor: "#f9e2af"
    status:
      newColor: "#89dceb"
      modifyColor: "#cba6f7"
      addColor: "#a6e3a1"
      pendingColor: "#fab387"
      errorColor: "#f38ba8"
      highlightColor: "#89b4fa"
      killColor: "#f5c2e7"
      completedColor: "#6c7086"
    title:
      fgColor: "#89b4fa"
      bgColor: default
      highlightColor: "#f9e2af"
      counterColor: "#a6e3a1"
      filterColor: "#f5c2e7"
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors: ["#a6e3a1", "#f38ba8"]
      defaultChartColors: ["#a6e3a1", "#f38ba8"]
    table:
      fgColor: "#cdd6f4"
      bgColor: default
      cursorFgColor: "#11111b"
      cursorBgColor: "#89b4fa"
      markColor: "#f9e2af"
      header:
        fgColor: "#a6adc8"
        bgColor: default
        sorterColor: "#f9e2af"
        selectedSortColumnColor: "#a6e3a1"
    xray:
      fgColor: "#cdd6f4"
      bgColor: default
      cursorColor: "#89b4fa"
      cursorTextColor: "#11111b"
      graphicColor: "#f9e2af"
    yaml:
      keyColor: "#89b4fa"
      colonColor: "#6c7086"
      valueColor: "#cdd6f4"
    picker:
      mainColor: "#cdd6f4"
      focusColor: "#89b4fa"
      shortcutColor: "#f9e2af"
    logs:
      fgColor: "#cdd6f4"
      bgColor: default
      indicator:
        fgColor: "#89b4fa"
        bgColor: default
        toggleOnColor: "#a6e3a1"
        toggleOffColor: "#6c7086"
